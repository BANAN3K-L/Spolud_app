<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=0">
    <title>Spolu app</title>

    <link rel="stylesheet" href="styles/style.css">
</head>
<body>
    <div class="intro-body">
        <img src="assety/pozadi.webp">
        <h1 class="intro-text">SPOLU</h1>
        <h1 class="intro-loading">💞</h1>
    </div>

    <img src="/assety/my.png" id="us-img">
    <img src="assety/pozadi.webp" id="bg_img">
    <div id="bg_darken"></div>
    <header>
        <h1>SPOLU</h1>
        <img src="/assety/cherry.png" id="cherry-img"> 
    </header>

    <div class="main-body">
        <div class="date">
            <div class="top-date">
                <b class="text-shade"><b id="pocet-let" class="date-number">XX</b><b class="date-letter">R</b></b>
                
                <b class="text-shade"><b id="pocet-mesicu" class="date-number">XX</b><b class="date-letter">M</b></b>
            </div>
            
            <div class="bottom-date">
                <b class="text-shade"><b id="pocet-dnu" class="date-number">XX</b><b class="date-letter">D</b></b>
            </div>

            <div class="bottom-date hour-date">
                <b class="text-shade"><b id="pocet-hodin" class="date-number3d">XX</b><b class="date2-letter">H</b></b>
                
                <b class="text-shade"><b id="pocet-minut" class="date-number3d">XX</b><b class="date2-letter">M</b></b>
                
                <b class="text-shade"><b id="pocet-sekund" class="date-number3d">XX</b><b class="date2-letter">S</b></b>
            </div>
        </div>


        <div class="vyroci-body">
            <div class="banner-body">
                <div class="banner-top">
                    <b>VÝROČÍ</b>
                </div>
                <div class="banner-bottom">
                    <b class="banner-date"><b id="vyroci-mesic">07</b><b class="banner-pink">M</b></b>
                    <b><b id="vyroci-den">17</b><b class="banner-pink">D</b></b>
                </div>
            </div>
        </div>



        <div class="motivace">
            <b id="motivace-text">"Jsi silná/ý a dokážeš všechno!"</b>
        </div>

    </div>

    
    <footer>
        <b>Pro nás zlato</b>
    </footer>

     <script src="scripts/script.js"></script>
</body>
</html>
