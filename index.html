<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=0">
    <title>Spolu app</title>

    <link rel="stylesheet" href="styles/style.css">
</head>
<body>
    <div class="intro-body">
        <h1 class="intro-text">SPOLU</h1>
        <h1 class="intro-loading">💞</h1>
    </div>

    <img src="assety/bg.jpg" id="bg_img">
    <div id="bg_darken"></div>
    <header>
        <h1>SPOLU</h1>
    </header>

    <div class="main-body">
        <div class="glass date">
            <div class="left-date">
                <b id="pocet-let" class="date-number">XX</b><b> ROKY</b>
                
                <p><b id="pocet-mesicu" class="date-number">XX</b><b> MĚSÍCE</b></p>

                <b id="pocet-dnu" class="date-number">XX</b><b> DNY</b>
            </div>

            <div class="right-date">
                <b id="pocet-hodin" class="date-number">XX</b><b> HODIN</b>
                
                <p><b id="pocet-minut" class="date-number">XX</b><b> MINUT</b></p>
                
                <b id="pocet-sekund" class="date-number">XX</b><b> SEKUND</b>
            </div>
        </div>

        <div class="glass vyroci">
            <b id="vyroci-text-edit">💖 Výročí za xx měsíců a xx dní 🌷</b>
        </div>


        <div class="oddelovac"></div>


        <div class="birthday">
            <h1>🎂 NAROZENINY 🎂</h1>
            <div class="birthday-content">
                <div class="glass bday">
                    <b class="bday-title">ONDRA</b>
                    <b class="date-number" id="bday-month-ondra">XX</b>
                    <b style="margin-bottom: 10px;">MĚSÍCŮ</b>
                    <b class="date-number" id="bday-day-ondra">XX</b>
                    <b>DNÍ</b>
                </div>

                <b id="plus">+</b>

                <div class="glass bday">
                    <b class="bday-title">KATE</b>
                    <b class="date-number" id="bday-month-kate">XX</b>
                    <b style="margin-bottom: 10px;">MĚSÍCŮ</b>
                    <b class="date-number" id="bday-day-kate">XX</b>
                    <b>DNÍ</b>
                </div>
            </div>
        </div>


        <div class="oddelovac"></div>


        <div class="glass motivace">
            <b id="motivace-text">"Jsi silná/ý a dokážeš všechno!"</b>
        </div>

    </div>

    <footer>
        <b>Vytvořeno jen pro nás zlato💞</b>
    </footer>

     <script src="scripts/script.js"></script>
</body>
</html>
